<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="icon-defs" aria-hidden="true">
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 8l1.4 10.2A2 2 0 0 0 6.4 20h11.2a2 2 0 0 0 2-1.8L21 8H3Z"/><path d="M3 8V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v0"/></symbol>
  <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 11v5M9.5 13.5h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.3"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.3"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.3"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><circle cx="3.8" cy="6" r="1.3"/><circle cx="3.8" cy="12" r="1.3"/><circle cx="3.8" cy="18" r="1.3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-6"/><path d="M3 20h18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 15V5.5a2 2 0 0 1 2-2H17"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M3 12h15"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7"/><path d="M6.5 7l1 12.2a2 2 0 0 0 2 1.8h5a2 2 0 0 0 2-1.8L17.5 7"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.3l2.7 5.6 6.1.6-4.6 4.1 1.4 6-5.6-3.3-5.6 3.3 1.4-6-4.6-4.1 6.1-.6L12 3.3Z"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l.9-3.9L15.5 5.5l3.9 3.9L8.8 20.9 4 20Z"/><path d="M13.8 7.2l3.9 3.9"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5.5L8 12l7 6.5"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5.5L16 12l-7 6.5"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4.5v4.5M15 4h4.5v4.5M4.5 15V19.5H9M19.5 15V19.5H15"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12.5M7 11.5l5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 3.5 3.5L17 10l3 3"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <header class="sidebar-top">
      <h1 class="brand"><svg class="icon" aria-hidden="true"><use href="#i-folder-open"/></svg>File Viewer</h1>
      <div class="row">
        <button id="openBtn" class="btn btn-primary">
          <svg class="icon" aria-hidden="true"><use href="#i-folder-open"/></svg>Open folder
        </button>
        <button id="reopenBtn" class="btn" hidden></button>
      </div>
    </header>

    <div class="search-box">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search files…" aria-label="Search files">
    </div>

    <div class="chips" id="typeChips" role="group" aria-label="Filter by type"></div>
    <div class="chips" id="tagChips" role="group" aria-label="Filter by tag"></div>

    <div class="row toolrow">
      <label class="sort-label">Sort
        <select id="sortSel" aria-label="Sort files">
          <option value="name">Name</option>
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="size-desc">Largest first</option>
          <option value="size-asc">Smallest first</option>
          <option value="type">Type</option>
        </select>
      </label>
      <button id="viewBtn" class="btn btn-icon" title="Toggle grid view" aria-label="Toggle grid view">
        <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>
      </button>
      <button id="statsBtn" class="btn btn-icon" title="Folder stats" aria-label="Folder stats">
        <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>
      </button>
      <button id="newFolderBtn" class="btn btn-icon" title="New folder" aria-label="New folder">
        <svg class="icon" aria-hidden="true"><use href="#i-folder-plus"/></svg>
      </button>
    </div>

    <div class="count" id="count"></div>

    <div class="row selrow">
      <button id="selAllBtn" class="btn btn-ghost btn-sm">Select all shown</button>
      <button id="selNoneBtn" class="btn btn-ghost btn-sm">Clear</button>
    </div>

    <ul id="list" class="list"></ul>

    <div class="actions" id="actions" hidden>
      <span id="selCount" class="sel-count"></span>
      <div class="row">
        <button id="copyBtn" class="btn btn-primary btn-sm"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Copy</button>
        <button id="moveBtn" class="btn btn-sm"><svg class="icon" aria-hidden="true"><use href="#i-move"/></svg>Move</button>
        <button id="dupBtn" class="btn btn-sm"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Duplicate</button>
        <button id="deleteBtn" class="btn btn-danger btn-sm"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Delete</button>
      </div>
    </div>
    <div id="status" class="status" role="status"></div>
  </aside>

  <main class="viewer">
    <div class="toolbar" id="toolbar" hidden>
      <span id="fileName" class="name"></span>
      <span id="fileInfo" class="info"></span>
      <div class="spacer"></div>
      <button id="favBtn" class="btn btn-icon" title="Favorite (F)" aria-label="Toggle favorite">
        <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
      </button>
      <button id="renameBtn" class="btn btn-icon" title="Rename (R)" aria-label="Rename file">
        <svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg>
      </button>
      <input id="tagInput" class="tag-input" placeholder="Add tag + Enter" aria-label="Add tag">
      <span id="fileTags" class="tags"></span>
      <button id="prevBtn" class="btn btn-icon" title="Previous (←)" aria-label="Previous file">
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
      </button>
      <button id="nextBtn" class="btn btn-icon" title="Next (→)" aria-label="Next file">
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
      <button id="fullBtn" class="btn btn-icon" title="Fullscreen (Enter)" aria-label="Fullscreen">
        <svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg>
      </button>
    </div>
    <div id="stage" class="stage">
      <div class="empty">
        <svg class="empty-icon" aria-hidden="true"><use href="#i-image"/></svg>
        <p>Open a folder, then click any file to view it here.</p>
        <p class="hint">Use ← → to move between files, F to favorite, R to rename.</p>
      </div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
